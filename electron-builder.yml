# Sprint 5 Packaging — electron-builder config
#
# Ships UNSIGNED for v1.0 (no Apple Developer account, no Windows code-signing
# cert). Users will hit Gatekeeper / SmartScreen on first install — see
# docs/INSTALL-WORKAROUND.md for the click-through.
#
# Cross-compilation note: macOS DMG must be built on macOS, Windows NSIS must
# be built on Windows. The .github/workflows/release.yml runs both in parallel
# on a build matrix and uploads artifacts to the GitHub Release.

appId: com.9expert.voicetotext
productName: 9VoiceToText
copyright: "Copyright © 2026 9Expert Training"

directories:
  output: dist
  buildResources: resources

# Only ship the compiled output + package.json. node_modules are picked up
# automatically (production deps only), source files stay out of the bundle.
files:
  - out/**
  - package.json
  - "!**/*.map" # source maps are dev-only

# asar packs the JS into a single archive for faster startup. Native modules
# (.node files) and native binaries (keytar, uiohook-napi prebuilds) MUST be
# unpacked or Electron can't dlopen them.
asar: true
asarUnpack:
  - "**/*.{node,dll}"
  - "**/keytar/**"
  - "**/uiohook-napi/**"

# Runtime assets loaded by path from the main process (tray icons). Without
# this the packaged app has NO tray icon — `files` only ships out/**.
# Lands at <app>/resources/icons; see src/main/tray/icons.ts.
extraResources:
  - from: resources/icons
    to: icons
    filter:
      - "tray-*.png"
      - "icon.png"
      - "icon.ico"

# ---- macOS ---------------------------------------------------------------
mac:
  category: public.app-category.productivity
  icon: resources/icons/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # No code signing for v1.0 — see docs/INSTALL-WORKAROUND.md.
  identity: null
  # hardenedRuntime requires signing; skip both.
  hardenedRuntime: false
  gatekeeperAssess: false
  # Microphone + accessibility usage strings shown in macOS permission prompts.
  extendInfo:
    NSMicrophoneUsageDescription: "9VoiceToText needs microphone access to transcribe your speech."
    NSAppleEventsUsageDescription: "9VoiceToText uses System Events to paste transcribed text via Cmd+V."
  artifactName: "${productName}-${version}-${arch}.${ext}"

dmg:
  title: "${productName} ${version}"
  artifactName: "${productName}-${version}-${arch}.${ext}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# ---- Windows -------------------------------------------------------------
win:
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  artifactName: "${productName}-${version}-${arch}.${ext}"
  # No code-signing cert, so users still see "Unknown publisher" on
  # SmartScreen — electron-builder skips signing automatically when no
  # CSC_LINK / WIN_CSC_LINK is configured. Do NOT set
  # `signAndEditExecutable: false`: that also skips the rcedit step that
  # embeds icon.ico + version info into the .exe, which left the installed
  # app (exe, taskbar, shortcuts) with Electron's default atom icon.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-Setup-${version}.${ext}"
  shortcutName: "9VoiceToText"
  uninstallDisplayName: "9VoiceToText"
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: "${productName}-Portable-${version}.${ext}"

# We publish via GitHub Releases manually (or via CI on tag push). Setting
# `null` here keeps `electron-builder` from trying to push during local builds.
publish: null
