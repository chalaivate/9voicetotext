<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    9VoiceToText app icon — 9Expert CI.
    Brand Blue #2486FF · Deep Navy #0D1B2A · Lime #D4F73F
    Concept: a microphone capsule (voice) resolving into text lines (text).
    Regenerate PNG/ICO/ICNS with:  npm run icons
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48B0FF"/>
      <stop offset="0.45" stop-color="#2486FF"/>
      <stop offset="1" stop-color="#0B3FB8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#0D1B2A" stop-opacity="0"/>
      <stop offset="1" stop-color="#0D1B2A" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEBFF"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6FF6B"/>
      <stop offset="1" stop-color="#C6EE1E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#06152B" flood-opacity="0.45"/>
    </filter>
    <clipPath id="squircle">
      <rect x="72" y="72" width="880" height="880" rx="196"/>
    </clipPath>
  </defs>

  <!-- Background squircle -->
  <g clip-path="url(#squircle)">
    <rect x="72" y="72" width="880" height="880" fill="url(#bg)"/>
    <rect x="72" y="72" width="880" height="880" fill="url(#glow)"/>
    <rect x="72" y="72" width="880" height="880" fill="url(#vignette)"/>
    <!-- Diagonal light sweep -->
    <path d="M72 72 L560 72 L72 560 Z" fill="#FFFFFF" fill-opacity="0.07"/>
  </g>
  <!-- Subtle inner edge highlight -->
  <rect x="80" y="80" width="864" height="864" rx="188" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="10"/>

  <!-- Microphone -->
  <g filter="url(#shadow)">
    <!-- Capsule -->
    <rect x="402" y="176" width="220" height="360" rx="110" fill="url(#capsule)"/>
    <!-- Grille slots -->
    <g fill="#0D1B2A" fill-opacity="0.22">
      <rect x="462" y="286" width="100" height="22" rx="11"/>
      <rect x="462" y="334" width="100" height="22" rx="11"/>
      <rect x="462" y="382" width="100" height="22" rx="11"/>
    </g>
    <!-- Cradle arc -->
    <path d="M312 430 A200 200 0 0 0 712 430" fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="46" stroke-linecap="round"/>
    <!-- Stem -->
    <path d="M512 632 L512 690" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="46" stroke-linecap="round"/>
  </g>

  <!-- Text lines (voice → text) -->
  <g filter="url(#shadow)">
    <rect x="322" y="726" width="380" height="48" rx="24" fill="url(#lime)"/>
    <rect x="402" y="808" width="220" height="48" rx="24" fill="url(#lime)" fill-opacity="0.9"/>
  </g>
</svg>
